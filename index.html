<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comment ça va ?</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#6b7280; --border:#d7dbe0;
    --accent:#4f46e5; --accent-ink:#ffffff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#111317; --card:#1a1d22; --text:#f2f3f5; --muted:#9aa1ab; --border:#3a3f47; }
  }
  :root[data-theme="dark"]{ --bg:#111317; --card:#1a1d22; --text:#f2f3f5; --muted:#9aa1ab; --border:#3a3f47; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  *{ box-sizing:border-box; }
  body{ height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main{ max-width:480px; margin:0 auto; padding:24px 16px 40px; }
  h1{ font-size:1.3rem; margin:4px 0 20px; text-align:center; }
  section.card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .ladder-wrap{ display:flex; flex-direction:column; align-items:center; }
  .cap{ color:var(--muted); font-size:.75rem; }
  .cap.top{ margin-bottom:2px; }
  .cap.bottom{ margin-top:2px; }
  #ladder{ width:56%; max-width:200px; height:auto; display:block; touch-action:manipulation; }
  textarea{ width:100%; margin-top:16px; min-height:70px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font:inherit; resize:vertical; }
  button#send{ width:100%; margin-top:14px; background:var(--accent); color:var(--accent-ink); font-weight:600;
    border:none; border-radius:10px; padding:13px 16px; font-size:1rem; cursor:pointer; }
  button#send:disabled{ opacity:.6; }
  #sentMsg{ text-align:center; color:#ef4444; font-size:.85rem; height:1.2em; margin-top:8px; }
  .note{ color:var(--muted); font-size:.82rem; line-height:1.4; margin:14px 0 0; text-align:center; }
  .thanks{ text-align:center; padding:30px 10px; }
  .thanks .big{ font-size:2rem; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <h1>Comment ça va ?</h1>

  <section class="card" id="formCard">
    <div class="ladder-wrap">
      <span class="cap top">excellent</span>
      <svg id="ladder" viewBox="0 0 170 420" xmlns="http://www.w3.org/2000/svg"></svg>
      <span class="cap bottom">très mal</span>
    </div>
    <textarea id="comment" placeholder="Un commentaire (optionnel)"></textarea>
    <button id="send">Envoyer</button>
    <div id="sentMsg"></div>
    <p class="note">Ne pas hésiter à me contacter si nécessaire.</p>
  </section>

  <section class="card thanks" id="thanksCard" style="display:none">
    <div class="big">✓</div>
    <div>Merci, c'est envoyé.</div>
  </section>
</main>

<script>
// FormSubmit.co : aucun compte à créer, juste l'adresse mail.
// Au tout premier envoi, FormSubmit t'enverra un mail de confirmation à cliquer une fois.
const FORM_ENDPOINT = "https://formsubmit.co/ajax/da98e0ecab7e74a817686bf8d9187048";


function scoreColor(n){
  const hue = (n-1) * (130/9);
  return `hsl(${hue}, 70%, 45%)`;
}

const RAIL_L = 30, RAIL_R = 120, TOP = 20, BOTTOM = 400, W = 170;
const spacing = (BOTTOM - TOP) / 9;
let selected = null;
const svg = document.getElementById('ladder');

function render(){
  let html = `
    <line x1="${RAIL_L}" y1="${TOP-10}" x2="${RAIL_L}" y2="${BOTTOM+10}" stroke="var(--border)" stroke-width="6" stroke-linecap="round"/>
    <line x1="${RAIL_R}" y1="${TOP-10}" x2="${RAIL_R}" y2="${BOTTOM+10}" stroke="var(--border)" stroke-width="6" stroke-linecap="round"/>`;
  for (let i=1;i<=10;i++){
    const y = BOTTOM - (i-1)*spacing;
    const on = selected && i <= selected;
    const rungColor = on ? scoreColor(i) : 'var(--border)';
    const textColor = on ? scoreColor(i) : 'var(--muted)';
    html += `<g data-n="${i}">
      <rect x="0" y="${y-spacing/2}" width="${W}" height="${spacing}" fill="transparent"/>
      <line x1="${RAIL_L}" y1="${y}" x2="${RAIL_R}" y2="${y}" stroke="${rungColor}" stroke-width="8" stroke-linecap="round"/>
      <text x="${RAIL_R+14}" y="${y+5}" font-size="16" font-weight="700" fill="${textColor}">${i}</text>
    </g>`;
  }
  svg.innerHTML = html;
}
render();

svg.addEventListener('click', (e) => {
  const g = e.target.closest('[data-n]');
  if(!g) return;
  selected = Number(g.getAttribute('data-n'));
  render();
});

const commentInput = document.getElementById('comment');
const sentMsg = document.getElementById('sentMsg');
const sendBtn = document.getElementById('send');

sendBtn.addEventListener('click', async () => {
  if (!selected){
    sentMsg.textContent = "Choisis un barreau avant d'envoyer";
    setTimeout(()=> sentMsg.textContent = '', 2000);
    return;
  }
  sendBtn.disabled = true;
  sentMsg.textContent = '';
  const comment = commentInput.value.trim();
  try{
    const params = new URLSearchParams();
    params.append('score', selected);
    params.append('comment', comment);
    params.append('_subject', `Comment ça va — ${selected}/10`);
    const res = await fetch(FORM_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/x-www-form-urlencoded', 'Accept':'application/json' },
      body: params.toString()
    });
    if (!res.ok) throw new Error('send failed');
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('thanksCard').style.display = 'block';
  }catch(e){
    sentMsg.textContent = "Erreur d'envoi, réessaie.";
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
